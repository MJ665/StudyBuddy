[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
markers =
    live: tests that hit real external services (Neon Postgres, Gemini). Skipped without creds/network.
    integration: tests that use the real dev database via TestClient/ORM fixtures.
filterwarnings =
    ignore::DeprecationWarning
    # langgraph emits this from ITS OWN internal import (jsonplus serializer);
    # nothing in our code can pass allowed_objects there.
    ignore:The default value of `allowed_objects` will change:Warning

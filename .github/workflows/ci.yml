# StudyHub CI — backend tests + frontend build gates.
# Ready for when the repo gets a GitHub remote. Live KT E2E is excluded
# (needs GEMINI_API_KEY + the dev database); run scripts/verify_all.sh
# locally for the full battery.
name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: development
      DEBUG: "True"
      SECRET_KEY: ci-dummy
      GEMINI_API_KEY: dummy
      # Tests need a Postgres with pgvector:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyhub_ci?sslmode=disable
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studyhub_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install deps
        working-directory: apps/api
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt -r requirements-dev.txt
      - name: Provision schema
        working-directory: apps/api
        run: .venv/bin/python scripts/phase1_provision.py
      - name: Tests (not live)
        working-directory: apps/api
        run: .venv/bin/python -m pytest -q -m "not live"
      - name: Route shadowing gate
        working-directory: apps/api
        run: .venv/bin/python scripts/check_route_shadowing.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install deps
        working-directory: apps/web-next
        run: npm ci
      - name: Type-check
        working-directory: apps/web-next
        run: npx tsc --noEmit
      - name: Build
        working-directory: apps/web-next
        run: npm run build
